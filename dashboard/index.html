<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MULTI</title>
<style>
:root {
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --r: 14px; --r-sm: 9px;
  --sans: "Inter", "SF Pro Text", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Inter Tight", "SF Pro Display", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #0b0b0d; --bg2: #111114; --panel: #16161a; --panel2: #1c1c21; --line: #26262d; --line2: #33333c;
  --ink: #f3f2ee; --ink2: #c9c7c0; --muted: #7d7b75; --faint: #4a4944;
  --ok: #3ddc97; --bad: #ff5d5d; --warn: #ffb547; --accent: #8b7bff;
  --glow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 30px -12px rgba(0,0,0,.6);
}
[data-theme="light"] {
  --bg: #f5f3ef; --bg2: #efece6; --panel: #ffffff; --panel2: #faf9f6; --line: #e6e2da; --line2: #d8d3c9;
  --ink: #141311; --ink2: #3a3833; --muted: #77736a; --faint: #b3aea4;
  --ok: #0f9a63; --bad: #d93636; --warn: #c27a12; --accent: #5b47ff;
  --glow: 0 0 0 1px rgba(0,0,0,.03), 0 12px 30px -16px rgba(30,25,10,.25);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.5 var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; transition: background .4s var(--ease), color .4s var(--ease); }
a { color: inherit; }
button { font: inherit; color: inherit; }
::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 10px; border: 3px solid var(--bg); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 268px 1fr; min-height: 100vh; }
aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px 18px; background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px; }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
.logo .orb { width: 26px; height: 26px; border-radius: 8px; background: conic-gradient(from 0deg, #ff4d8d, #ffb547, #3ddc97, #4db8ff, #8b7bff, #ff4d8d); animation: spin 12s linear infinite; position: relative; }
.logo .orb::after { content: ""; position: absolute; inset: 5px; border-radius: 4px; background: var(--bg2); }
.logo b { font: 800 16px/1 var(--display); letter-spacing: .32em; }
@keyframes spin { to { transform: rotate(360deg); } }
.group h6 { margin: 0 0 6px; padding: 0 10px; font: 600 10.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.nav-item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 10px; cursor: pointer; text-align: left; color: var(--ink2); transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease); }
.nav-item:hover { background: var(--panel); color: var(--ink); }
.nav-item:active { transform: scale(.98); }
.nav-item.on { background: var(--panel); color: var(--ink); box-shadow: var(--glow); }
.nav-item.on::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, var(--accent)); animation: grow .3s var(--ease); }
@keyframes grow { from { transform: scaleY(0); } }
.nav-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.count { min-width: 22px; padding: 1px 7px; border-radius: 99px; font: 600 11px/18px var(--mono); text-align: center; color: var(--muted); background: transparent; }
.count.hot { color: #fff; background: var(--c, var(--accent)); box-shadow: 0 0 14px -2px var(--c, var(--accent)); }
.mono { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; font: 700 10px/1 var(--mono); letter-spacing: .02em; color: #fff; background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.mono.sm { width: 20px; height: 20px; border-radius: 6px; font-size: 8.5px; }
.mono.lg { width: 38px; height: 38px; border-radius: 11px; font-size: 13px; }
.mono.all { background: linear-gradient(135deg, var(--line2), var(--panel2)); color: var(--ink); }
.foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; color: var(--muted); font: 11px/1.3 var(--mono); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2.4s infinite; flex: none; }
.pulse.off { background: var(--bad); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.theme { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; transition: transform .3s var(--spring); }
.theme:hover { transform: rotate(-20deg) scale(1.05); }

/* ---------- top ---------- */
.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 14px 28px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid var(--line); }
.crumb { display: flex; align-items: center; gap: 8px; font: 600 15px/1 var(--display); white-space: nowrap; }
.crumb .sep { color: var(--faint); font-weight: 400; }
.crumb .dim { color: var(--muted); font-weight: 500; }
.tabs { position: relative; display: flex; gap: 2px; padding: 4px; margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.tab { position: relative; z-index: 1; display: flex; align-items: center; gap: 5px; padding: 6px 9px; font-size: 13px; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 550; white-space: nowrap; transition: color .25s var(--ease); }
.tab.on { color: var(--ink); }
.tab .count { padding: 0 6px; line-height: 17px; }
.tab-ind { position: absolute; z-index: 0; top: 4px; bottom: 4px; border-radius: 8px; background: var(--panel2); box-shadow: var(--glow); transition: left .45s var(--spring), width .45s var(--spring); }
.content { padding: 30px 34px 80px; max-width: 1320px; }
.h1 { font: 700 30px/1.1 var(--display); letter-spacing: -.025em; margin: 0 0 6px; }
.lede { color: var(--muted); margin: 0 0 26px; max-width: 640px; }

/* ---------- enter animation ---------- */
.enter > * { animation: rise .55s var(--ease) both; }
.enter > *:nth-child(2) { animation-delay: .05s; } .enter > *:nth-child(3) { animation-delay: .1s; } .enter > *:nth-child(4) { animation-delay: .15s; } .enter > *:nth-child(5) { animation-delay: .2s; } .enter > *:nth-child(n+6) { animation-delay: .25s; }
.stagger > * { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.99); filter: blur(3px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
.kpi { position: relative; overflow: hidden; padding: 16px 16px 14px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); cursor: pointer; transition: transform .35s var(--spring), border-color .3s; }
.kpi:hover { transform: translateY(-3px); border-color: var(--line2); }
.kpi .v { font: 700 30px/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi .l { margin-top: 8px; font-size: 12px; color: var(--muted); }
.kpi::after { content: ""; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: var(--k); opacity: .14; filter: blur(18px); transition: opacity .3s; }
.kpi:hover::after { opacity: .3; }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; margin-bottom: 18px; }
.panel h3 { margin: 0 0 14px; font: 650 13px/1 var(--sans); letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.panel h3 small { color: var(--muted); font-weight: 500; }
.two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }

/* matrix */
.matrix { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
.matrix th { font: 600 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 4px 6px; text-align: center; }
.matrix th:first-child { text-align: left; }
.matrix td { padding: 0 4px; text-align: center; }
.matrix td.b { text-align: left; white-space: nowrap; }
.bname { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
.cell { position: relative; display: grid; place-items: center; width: 100%; min-width: 46px; height: 40px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: transform .3s var(--spring), background .2s; font: 600 12px/1 var(--mono); }
.cell:hover { transform: scale(1.08); }
.cell.on { background: color-mix(in srgb, var(--c) 16%, var(--panel2)); border-color: color-mix(in srgb, var(--c) 35%, transparent); color: var(--ink); }
.cell.setup { border: 1px dashed var(--warn); color: var(--warn); font-size: 9px; letter-spacing: .06em; }
.cell.off { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--line) 70%, transparent) 5px 6px); color: var(--faint); }
.cell .dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.legend { display: flex; gap: 16px; margin-top: 10px; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }

/* ---------- cards ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px 18px 24px; transition: transform .35s var(--spring), border-color .3s, box-shadow .3s, opacity .4s, max-height .5s var(--ease), margin .5s, padding .5s; overflow: hidden; }
.card:hover { transform: translateY(-2px); border-color: var(--line2); box-shadow: var(--glow); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.card.leaving { opacity: 0; transform: translateX(30px) scale(.96); pointer-events: none; }
.card.leaving.bad { transform: translateX(-30px) scale(.96); }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head .who { flex: 1; min-width: 0; }
.card-head .who b { display: block; font-size: 13px; }
.card-head .who span { color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font: 600 10.5px/1.4 var(--sans); letter-spacing: .03em; background: var(--panel2); border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.hook { margin: 14px 0 6px; font: 650 17px/1.35 var(--display); letter-spacing: -.01em; }
.meta { color: var(--muted); font: 11.5px/1.4 var(--mono); }
.body { position: relative; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink2); max-height: 190px; overflow: hidden; transition: max-height .5s var(--ease); }
.body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(transparent, var(--panel)); pointer-events: none; transition: opacity .3s; }
.body.open { max-height: 2000px; } .body.open::after { opacity: 0; }
.more { margin-top: 6px; border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0; }
.more:hover { color: var(--ink); }
.md h2, .md h3, .md h4 { margin: 14px 0 4px; font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.md p { margin: 4px 0; } .md ul { margin: 4px 0; padding-left: 18px; } .md li { margin: 2px 0; }
.md code { font: 12px var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 5px; }
.md a { color: var(--accent); }
.note, textarea { width: 100%; margin-top: 14px; font: inherit; color: var(--ink); background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; transition: border-color .2s, box-shadow .2s; }
.note:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
textarea { min-height: 130px; resize: vertical; line-height: 1.55; }
.note.shake { animation: shake .4s; border-color: var(--bad); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; transition: transform .25s var(--spring), background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { transform: translateY(-1px); border-color: var(--line2); }
.btn:active { transform: scale(.96); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #06140d; box-shadow: 0 8px 22px -10px var(--ok); }
.btn.go { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.bad { background: transparent; color: var(--bad); }
.btn.bad:hover { border-color: var(--bad); }
.kbd { font: 10px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .55; }

/* ---------- media ---------- */
.media { display: flex; gap: 10px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
.phone { flex: none; position: relative; width: 128px; aspect-ratio: 9 / 16; border-radius: 18px; padding: 5px; background: #000; box-shadow: 0 0 0 1px var(--line2), 0 14px 30px -14px rgba(0,0,0,.7); transition: transform .35s var(--spring); }
.phone:hover { transform: translateY(-3px) rotate(-1deg); }
.phone.r45 { aspect-ratio: 4 / 5; width: 150px; border-radius: 14px; }
.phone.r23 { aspect-ratio: 2 / 3; width: 130px; border-radius: 14px; }
.phone.r169 { aspect-ratio: 16 / 9; width: 230px; border-radius: 12px; }
.phone img, .phone video { width: 100%; height: 100%; object-fit: cover; border-radius: 13px; display: block; background: var(--panel2); }
.phone.r45 img, .phone.r23 img, .phone.r169 img, .phone.r169 video { border-radius: 9px; }
.phone .k { position: absolute; left: 10px; bottom: 10px; font: 600 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 5px; backdrop-filter: blur(6px); }
.prompt { flex: none; width: 128px; aspect-ratio: 9 / 16; border-radius: 18px; border: 1px dashed var(--line2); padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; color: var(--muted); font-size: 11px; line-height: 1.35; background: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--line) 60%, transparent) 8px 9px); }
.prompt b { font: 600 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--warn); }
[dir="rtl"] { text-align: right; }
.lang { font: 700 10px/1 var(--mono); padding: 4px 7px; border-radius: 6px; background: var(--ink); color: var(--bg); }
.edit-area { min-height: 260px; font: 13px/1.6 var(--mono); }
.bar { display: flex; align-items: center; gap: 12px; margin: -10px 0 22px; flex-wrap: wrap; }
/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { min-height: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.day.past { opacity: .55; }
.day h5 { margin: 0 0 8px; display: flex; justify-content: space-between; font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
.day h5 b { color: var(--ink); font: 700 15px/1 var(--display); }
.slot { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 4px 6px; padding: 6px 7px; margin-bottom: 5px; border-radius: 7px; background: color-mix(in srgb, var(--c) 14%, var(--panel2)); border-left: 3px solid var(--c); font-size: 11.5px; line-height: 1.25; transition: transform .25s var(--spring); }
.slot:hover { transform: translateX(2px); }
.slot .t { font: 600 10px var(--mono); color: var(--muted); flex: none; }
.slot .h { grid-column: 1 / -1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slot .bi { justify-self: end; font: 600 10px var(--mono); color: var(--muted); }
.slot.st-review { outline: 1px dashed var(--warn); outline-offset: -1px; }
/* ---------- analytics ---------- */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.chart svg { width: 100%; height: 170px; overflow: visible; }
.chart .big { font: 700 26px/1 var(--display); letter-spacing: -.02em; }
.delta { font: 600 12px var(--mono); margin-left: 8px; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
.chart path.line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.2s var(--ease) forwards; }
.chart path.area { opacity: .12; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.legend2 { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.legend2 i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }
.mtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.mtable th { text-align: right; font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.mtable th:first-child, .mtable td:first-child { text-align: left; }
.mtable td { text-align: right; padding: 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
/* ---------- team ---------- */
.org { display: flex; flex-direction: column; align-items: center; gap: 0; }
.node { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--glow); }
.node.boss { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent), var(--glow); }
.node.brain { padding: 18px 26px; border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--panel)), var(--panel)); }
.node b { font: 700 16px/1.1 var(--display); }
.node small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.vline { width: 2px; height: 26px; background: linear-gradient(var(--line2), var(--accent)); position: relative; overflow: hidden; }
.vline::after { content: ""; position: absolute; left: 0; top: -40%; width: 100%; height: 40%; background: var(--accent); animation: flow 1.8s linear infinite; }
@keyframes flow { to { top: 110%; } }
.depts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; width: 100%; margin-top: 6px; position: relative; padding-top: 18px; border-top: 2px solid var(--line); }
.dept { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 10px; transition: transform .3s var(--spring), border-color .2s; }
.dept:hover { transform: translateY(-2px); border-color: var(--line2); }
.dept h4 { margin: 0 0 2px; display: flex; align-items: center; gap: 8px; font: 700 13px/1.2 var(--display); }
.dept h4 .count { margin-left: auto; }
.dept p { margin: 0 0 10px; color: var(--muted); font-size: 11.5px; }
.ag { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 7px; font-size: 12.5px; cursor: default; }
.ag:hover { background: var(--panel2); }
.ag .d { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.ag .d.live { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2.4s infinite; }
.ag .d.recent { background: color-mix(in srgb, var(--ok) 45%, var(--faint)); }
.ag .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag .m { font: 600 9.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ag .c { font: 600 10.5px var(--mono); color: var(--ink2); min-width: 16px; text-align: right; }
.layers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; margin-top: 18px; }
.layer { border: 1px dashed var(--line2); border-radius: var(--r); padding: 12px 14px; font-size: 12px; color: var(--muted); }
.layer b { display: block; color: var(--ink); font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
.layer code { font: 11px var(--mono); color: var(--ink2); }
/* interrupts */
.intr { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.intr .i { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; transition: transform .3s var(--spring), border-color .2s; }
.intr .i:hover { transform: translateY(-2px); border-color: var(--c); }
.intr .i b { font: 700 22px/1 var(--display); color: var(--c); min-width: 26px; }
.intr .i span { font-size: 12.5px; color: var(--ink2); line-height: 1.3; }
.intr .i.zero { opacity: .45; } .intr .i.zero b { color: var(--muted); }
.kpi.hero { grid-column: span 2; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--panel)), var(--panel)); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.kpi.hero .v { font-size: 40px; }
/* ---------- kanban ---------- */
.kanban { display: grid; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 10px; }
.col { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 220px; }
.col-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.col-h i { width: 8px; height: 8px; border-radius: 50%; background: var(--s); }
.col-h .count { margin-left: auto; }
.mini { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px 11px 15px; margin-bottom: 10px; transition: transform .3s var(--spring), border-color .2s; }
.mini::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
.mini:hover { transform: translateY(-2px) rotate(-.3deg); border-color: var(--line2); }
.mini b { display: block; margin: 8px 0 4px; font-size: 13px; line-height: 1.35; font-weight: 600; }
.mini .row { display: flex; align-items: center; gap: 6px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.lrow { display: grid; grid-template-columns: auto 1.1fr 1.6fr 1.4fr auto auto; gap: 16px; align-items: center; padding: 14px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); transition: transform .3s var(--spring), border-color .2s; }
.lrow:hover { transform: translateX(3px); border-color: var(--line2); }
.lrow b { font-weight: 600; }
.lrow .sub { color: var(--muted); font-size: 12px; }
select { font: 600 12px var(--sans); padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); cursor: pointer; }
.task { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); transition: opacity .4s, transform .3s var(--spring); }
.task.done { opacity: .45; }
.check { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 8px; border: 1.5px solid var(--line2); background: transparent; cursor: pointer; display: grid; place-items: center; transition: background .25s, border-color .25s, transform .3s var(--spring); }
.check:hover { transform: scale(1.1); border-color: var(--ok); }
.check svg { width: 14px; height: 14px; stroke: #06140d; stroke-width: 3; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .35s var(--ease) .05s; }
.task.done .check { background: var(--ok); border-color: var(--ok); }
.task.done .check svg { stroke-dashoffset: 0; }
.task .t-body { flex: 1; min-width: 0; }
.task .t-body .md p:first-child { margin-top: 0; }

.empty { display: grid; place-items: center; gap: 10px; padding: 60px 20px; border: 1px dashed var(--line2); border-radius: var(--r); color: var(--muted); text-align: center; }
.empty .big { font: 700 44px/1 var(--display); color: var(--faint); }

.toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: 0 20px 40px -10px rgba(0,0,0,.5); transform: translate(-50%, 30px); opacity: 0; transition: transform .45s var(--spring), opacity .3s; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--t, var(--ok)); }

@media (max-width: 1100px) { .cal { grid-template-columns: repeat(2, minmax(0, 1fr)); }  .kpis { grid-template-columns: repeat(3, 1fr); } .two { grid-template-columns: 1fr; } .lrow { grid-template-columns: auto 1fr auto; } .lrow .hide-sm { display: none; } }
@media (max-width: 820px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; } .top { flex-wrap: wrap; padding: 12px 18px; } .tabs { margin-left: 0; width: 100%; } .content { padding: 22px 18px 60px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><div class="orb"></div><b>MULTI</b></div>
    <div class="group"><h6>Companies</h6><div id="brandNav"></div></div>
    <div class="group"><h6>Channels</h6><div id="platNav"></div></div>
    <div class="foot"><span class="pulse" id="pulse"></span><span id="sync">connecting…</span>
      <button class="theme" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button></div>
  </aside>
  <div class="main">
    <div class="top"><div class="crumb" id="crumb"></div><div class="tabs" id="tabs"><div class="tab-ind" id="ind"></div></div></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"><i></i><span></span></div>
<script>
// ---------- registry ----------
const PLATFORMS = {
  instagram: ['Instagram', 'IG', '#e1306c'], tiktok: ['TikTok', 'TT', '#00c2b8'], youtube: ['YouTube', 'YT', '#ff2d2d'],
  x: ['X', 'X', '#6b6b76'], linkedin: ['LinkedIn', 'IN', '#2a7be4'], threads: ['Threads', 'TH', '#9b9ba5'],
  pinterest: ['Pinterest', 'PI', '#e6233a'], reddit: ['Reddit', 'RD', '#ff5a1f'], facebook: ['Facebook', 'FB', '#3b6ef5'],
  blog: ['Blog · SEO', 'SEO', '#22b573'], gbp: ['Google Business', 'GB', '#f2b01e'], email: ['Email', '@', '#a07cff'],
  telegram: ['Telegram', 'TG', '#2aa3e0'], whatsapp: ['WhatsApp', 'WA', '#25c25a'], quora: ['Quora', 'QA', '#c4302b'], medium: ['Medium', 'MD', '#8d8d8d'], substack: ['Substack', 'SB', '#ff6719'],
};
const PALETTE = ['#8b7bff', '#ff6b9a', '#3ddc97', '#ffb547', '#4db8ff', '#ff7a45', '#c56bff', '#2fd3c6'];
const VIEWS = [['overview', 'Overview'], ['team', 'Team'], ['review', 'Review'], ['engagement', 'Engagement'], ['pipeline', 'Pipeline'], ['calendar', 'Calendar'], ['analytics', 'Analytics'], ['leads', 'Leads'], ['tasks', 'Needs you'], ['trends', 'Trends']];
const STAGES = [['idea', '#7d7b75'], ['draft', '#4db8ff'], ['review', '#ffb547'], ['approved', '#3ddc97'], ['scheduled', '#8b7bff'], ['published', '#c9c7c0']];

const S = { state: null, sig: '', view: 'overview', brand: 'all', plat: 'all', editing: new Set(), anim: true, week: 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const hash = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const plat = p => { const k = String(p || '').toLowerCase(); const r = PLATFORMS[k]; return r ? { key: k, name: r[0], short: r[1], color: r[2] } : { key: k, name: p || '—', short: String(p || '?').slice(0, 2).toUpperCase(), color: PALETTE[hash(k) % PALETTE.length] }; };
const brand = slug => { const b = (S.state?.brands || []).find(x => x.slug === slug); const name = b?.name || (slug === 'all' ? 'All' : slug || '—'); return { slug, name, color: b?.color || PALETTE[hash(slug) % PALETTE.length], initials: name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(), b }; };
const mono = (txt, color, cls = '') => `<span class="mono ${cls}" style="--c:${esc(color)}">${esc(txt)}</span>`;

// ---------- theme ----------
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
document.documentElement.dataset.theme = store.get('multi-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
$('theme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('multi-theme', t); };

// ---------- markdown ----------
function md(src) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  let html = '', list = false;
  for (const line of String(src || '').split('\n')) {
    const h = line.match(/^(#{1,4})\s+(.*)/), li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }
    if (h) html += `<h3>${inline(h[2])}</h3>`; else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? '</ul>' : '');
}
const section = (body, name) => { const p = String(body || '').split(/^## /m).find(x => x.toLowerCase().startsWith(name.toLowerCase())); return p ? p.slice(p.indexOf('\n') + 1).trim() : ''; };

// ---------- media ----------
function assets(i) {
  return section(i.body, 'Assets').split('\n').map(l => l.replace(/^\s*[-*]\s*/, '')).filter(Boolean).map(l => {
    const o = {}; for (const part of l.split('|')) { const m = part.match(/^\s*(\w+):\s*(.+?)\s*$/); if (m) o[m[1]] = m[2]; }
    return o;
  }).filter(o => o.url || o.file || o.prompt);
}
const isVideo = s => /\.(mp4|mov|webm)(\?|$)/i.test(s || '');
function frameClass(i) { const f = String(i.format || '').toLowerCase(); if (/pin/.test(f)) return 'r23'; if (/carousel|post|image|ad/.test(f)) return 'r45'; if (/video|article|thumbnail/.test(f) && !/short/.test(f)) return 'r169'; return ''; }
function mediaStrip(i) {
  const list = assets(i); if (!list.length) return '';
  return `<div class="media">${list.slice(0, 6).map(a => {
    const src = a.url && safeUrl(a.url) ? a.url : a.file ? '/' + a.file.replace(/^\/+/, '') : '';
    if (!src) return `<div class="prompt"><b>not rendered</b>${esc(String(a.prompt || '').slice(0, 140))}</div>`;
    const kind = a.kind || (isVideo(src) ? 'video' : 'image');
    return `<a class="phone ${frameClass(i)}" href="${esc(src)}" target="_blank" rel="noopener">${kind === 'video' ? `<video src="${esc(src)}" muted loop playsinline preload="metadata"></video>` : `<img src="${esc(src)}" alt="" loading="lazy">`}<span class="k">${esc(a.role || kind)}</span></a>`;
  }).join('')}</div>`;
}

// ---------- data ----------
const inScope = i => (S.brand === 'all' || i.brand === S.brand || i.brand === 'all') && (S.plat === 'all' || i.type === 'task' || String(i.platform || '').toLowerCase() === S.plat);
const items = type => S.state.items.filter(i => i.type === type && inScope(i));
const pending = (it) => it.filter(i => (i.type === 'content' && i.status === 'review') || (i.type === 'engagement' && i.status === 'pending') || (i.type === 'lead' && i.status === 'new')).length;
function platformsInUse() {
  const set = new Set();
  for (const b of S.state.brands) for (const p of b.platforms) if ((p.status || '').toLowerCase() !== 'off') set.add(String(p.platform).toLowerCase());
  for (const i of S.state.items) if (i.platform) set.add(String(i.platform).toLowerCase());
  const order = Object.keys(PLATFORMS);
  return [...set].filter(Boolean).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99 || a.localeCompare(b));
}

// ---------- io ----------
async function refresh(force) {
  if (!force && S.editing.size) return;
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const st = await r.json();
    const sig = JSON.stringify(st.items.map(i => [i.id, i.status, i.mtime])) + st.brands.length + st.trends.length + '|' + (st.metrics || []).length + JSON.stringify(st.activity || {});
    $('pulse').className = 'pulse';
    $('sync').textContent = 'live · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    if (sig === S.sig && !force) return;
    S.state = st; S.sig = sig; render();
  } catch { $('pulse').className = 'pulse off'; $('sync').textContent = 'offline · retrying'; }
}
async function act(id, payload, msg, tone) {
  const r = await fetch('/api/items/' + encodeURIComponent(id), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || 'failed', 'var(--bad)'); return false; }
  S.editing.delete(id); toast(msg, tone); S.anim = false; await refresh(true); return true;
}
function toast(t, color) { const el = $('toast'); el.querySelector('span').textContent = t; el.style.setProperty('--t', color || 'var(--ok)'); el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2000); }

// ---------- render ----------
function render() {
  const st = S.state, all = st.items;
  // sidebar: companies
  const bcount = slug => pending(all.filter(i => slug === 'all' || i.brand === slug)) + all.filter(i => i.type === 'task' && i.status === 'open' && (slug === 'all' || i.brand === slug || i.brand === 'all')).length;
  $('brandNav').innerHTML = [{ slug: 'all' }, ...st.brands].map(x => {
    const b = brand(x.slug), n = bcount(x.slug);
    return `<button class="nav-item ${S.brand === x.slug ? 'on' : ''}" style="--c:${x.slug === 'all' ? 'var(--accent)' : b.color}" data-brand="${esc(x.slug)}">${x.slug === 'all' ? mono('∗', '', 'all') : mono(b.initials, b.color)}<span class="label">${esc(x.slug === 'all' ? 'All companies' : b.name)}</span><span class="count ${n ? 'hot' : ''}">${n || ''}</span></button>`;
  }).join('');
  // sidebar: channels
  const scoped = all.filter(i => S.brand === 'all' || i.brand === S.brand);
  $('platNav').innerHTML = ['all', ...platformsInUse()].map(k => {
    const p = k === 'all' ? { name: 'All channels', short: '∗', color: '' } : plat(k);
    const n = k === 'all' ? pending(scoped) : pending(scoped.filter(i => String(i.platform || '').toLowerCase() === k));
    return `<button class="nav-item ${S.plat === k ? 'on' : ''}" style="--c:${p.color || 'var(--accent)'}" data-plat="${esc(k)}">${k === 'all' ? mono('∗', '', 'all') : mono(p.short, p.color)}<span class="label">${esc(p.name)}</span><span class="count ${n ? 'hot' : ''}">${n || ''}</span></button>`;
  }).join('');
  // crumb
  const b = brand(S.brand), p = plat(S.plat);
  $('crumb').innerHTML = `${S.brand === 'all' ? '<span>All companies</span>' : `${mono(b.initials, b.color, 'sm')}<span>${esc(b.name)}</span>`}<span class="sep">/</span>${S.plat === 'all' ? '<span class="dim">All channels</span>' : `${mono(p.short, p.color, 'sm')}<span class="dim">${esc(p.name)}</span>`}`;
  // tabs
  const counts = { review: items('content').filter(i => i.status === 'review').length, engagement: items('engagement').filter(i => i.status === 'pending').length, leads: items('lead').filter(i => i.status === 'new').length, tasks: items('task').filter(i => i.status === 'open').length };
  $('tabs').innerHTML = '<div class="tab-ind" id="ind"></div>' + VIEWS.map(([k, l]) => `<button class="tab ${S.view === k ? 'on' : ''}" data-view="${k}">${l}${counts[k] ? `<span class="count hot">${counts[k]}</span>` : ''}</button>`).join('');
  requestAnimationFrame(moveInd);
  // content
  const c = $('content');
  c.innerHTML = (VIEW[S.view] || VIEW.overview)();
  c.classList.remove('enter'); if (S.anim) { void c.offsetWidth; c.classList.add('enter'); }
  S.anim = true;
  c.querySelectorAll('[data-count]').forEach(countUp);
}
function moveInd() { const on = document.querySelector('.tab.on'), ind = $('ind'); if (!on || !ind) return; ind.style.left = on.offsetLeft + 'px'; ind.style.width = on.offsetWidth + 'px'; }
function countUp(el) { const to = +el.dataset.count, t0 = performance.now(), d = 700; const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
const head = (title, lede) => `<div><h1 class="h1">${title}</h1><p class="lede">${lede}</p></div>`;
const empty = (big, text) => `<div class="empty"><div class="big">${big}</div><div>${text}</div></div>`;

const VIEW = {
  team() { return teamView(); },
  overview() {
    const st = S.state, scope = st.items.filter(inScope);
    const n = (t, s) => scope.filter(i => i.type === t && i.status === s).length;
    const yes = n('content', 'review') + n('engagement', 'pending') + n('task', 'open');
    const kpis = [['Waiting on your yes', yes, '#8b7bff', 'review', 'hero'], ['AI agents', (st.agents || []).length, '#3ddc97', 'team'], ['Scheduled', n('content', 'scheduled'), '#4db8ff', 'calendar'], ['New leads', n('lead', 'new'), '#ff6b9a', 'leads'], ['Human employees', 1, '#ffb547', 'tasks']];
    const brands = st.brands.filter(b => S.brand === 'all' || b.slug === S.brand);
    const plats = platformsInUse().filter(k => S.plat === 'all' || k === S.plat);
    const cell = (bs, k) => {
      const row = bs.platforms.find(r => String(r.platform).toLowerCase() === k);
      const status = (row?.status || (st.items.some(i => i.brand === bs.slug && String(i.platform).toLowerCase() === k) ? 'on' : 'off')).toLowerCase();
      const q = pending(st.items.filter(i => i.brand === bs.slug && String(i.platform).toLowerCase() === k));
      const pc = plat(k).color;
      const tip = `${brand(bs.slug).name} · ${plat(k).name} · ${status}${row?.handle ? ' · ' + row.handle : ''}${row?.['quota/week'] ? ' · ' + row['quota/week'] + '/wk' : ''}`;
      return `<td><div class="cell ${status === 'setup' ? 'setup' : status === 'off' ? 'off' : 'on'}" style="--c:${pc}" title="${esc(tip)}" data-jump="${esc(bs.slug)}|${esc(k)}">${status === 'setup' ? 'SETUP' : status === 'off' ? '' : (q ? q : '·')}${q && status !== 'off' ? '<span class="dot"></span>' : ''}</div></td>`;
    };
    const next = scope.filter(i => i.type === 'content' && i.status === 'review').slice(0, 4);
    const tasks = scope.filter(i => i.type === 'task' && i.status === 'open').sort((a, b) => (b.priority === 'high') - (a.priority === 'high')).slice(0, 4);
    return head('Overview', `${brands.length} ${brands.length === 1 ? 'company' : 'companies'} · ${plats.length} channels · everything waiting for you, at a glance.`)
      + `<div class="kpis">${kpis.map(([l, v, k, go, cls]) => `<div class="kpi ${cls || ''}" style="--k:${k}" data-view="${go}"><div class="v" data-count="${v}">0</div><div class="l">${l}${l === 'Human employees' ? ' · you' : ''}</div></div>`).join('')}</div>`
      + interrupts(scope)
      + (brands.length ? `<div class="panel"><h3>Coverage <small>companies × channels · number = waiting for you</small></h3><div style="overflow-x:auto"><table class="matrix"><tr><th></th>${plats.map(k => `<th title="${esc(plat(k).name)}">${esc(plat(k).short)}</th>`).join('')}</tr>${brands.map(bs => { const bb = brand(bs.slug); return `<tr><td class="b"><span class="bname" data-brand="${esc(bs.slug)}">${mono(bb.initials, bb.color)}${esc(bb.name)}</span></td>${plats.map(k => cell(bs, k)).join('')}</tr>`; }).join('')}</table></div>
        <div class="legend"><span><i style="background:color-mix(in srgb,var(--accent) 25%,var(--panel2))"></i>active</span><span><i style="border:1px dashed var(--warn)"></i>to set up</span><span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px)"></i>off</span></div></div>`
        : empty('0', 'No companies yet. Run <code>multi-brand-onboarding</code> in Claude.'))
      + `<div class="two"><div class="panel"><h3>Up next <small>${next.length ? 'oldest first' : ''}</small></h3>${next.length ? `<div class="list stagger">${next.map((i, x) => { const pp = plat(i.platform), bb = brand(i.brand); return `<div class="mini" style="--c:${pp.color};--i:${x}" data-view="review"><div class="row">${mono(pp.short, pp.color, 'sm')}<span class="meta">${esc(bb.name)} · ${esc(i.format || '')}</span></div><b>${esc(i.hook || i.id)}</b></div>`; }).join('')}</div>` : '<div class="meta">Nothing in review.</div>'}</div>

      + `<div class="kanban">${STAGES.map(([s, col]) => { const cards = list.filter(i => i.status === s); return `<div class="col"><div class="col-h" style="--s:${col}"><i></i>${s}<span class="count">${cards.length}</span></div><div class="stagger">${cards.map((i, x) => { const pp = plat(i.platform), bb = brand(i.brand); return `<div class="mini" style="--c:${pp.color};--i:${x}"><div class="row">${mono(pp.short, pp.color, 'sm')}${mono(bb.initials, bb.color, 'sm')}<span class="meta">${esc(i.format || '')}</span></div><b>${esc(i.hook || i.id)}</b><div class="meta">${esc(i.scheduled_at ? String(i.scheduled_at).replace('T', ' ').slice(0, 16) : (i.owner || ''))}</div></div>`; }).join('')}</div></div>`; }).join('')}</div>`;
  },
  calendar() {
    const list = items('content').filter(i => i.scheduled_at && !isNaN(Date.parse(i.scheduled_at)) && i.status !== 'rejected');
    const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - ((start.getDay() + 6) % 7) + 7 * (S.week || 0));
    const days = [...Array(14)].map((_, k) => { const d = new Date(start); d.setDate(d.getDate() + k); return d; });
    const today = new Date(); today.setHours(0, 0, 0, 0);

  },
  analytics() {
    const ms = (S.state.metrics || []).filter(m => S.brand === 'all' || m.brand === S.brand);
    if (!ms.length) return head('Analytics', 'Weekly numbers per company and channel.') + empty('—', 'No metrics yet. The analyst writes <code>metrics/&lt;brand&gt;/&lt;date&gt;.json</code> at the end of each week.');
    const weeks = [...new Set(ms.map(m => m.date))].sort();
    const platsAll = [...new Set(ms.flatMap(m => Object.keys(m.platforms || {})))].filter(k => S.plat === 'all' || k === S.plat);
    const val = (w, p, metric) => ms.filter(m => m.date === w).reduce((s, m) => s + (+(m.platforms?.[p]?.[metric]) || 0), 0);
    const total = (w, metric) => platsAll.reduce((s, p) => s + val(w, p, metric), 0);
    const nf = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'k' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n));
    const chart = (metric, label) => {
      const W = 320, H = 150, pad = 6, max = Math.max(1, ...weeks.flatMap(w => platsAll.map(p => val(w, p, metric))));
      const x = k => pad + (weeks.length === 1 ? (W - 2 * pad) / 2 : k * (W - 2 * pad) / (weeks.length - 1)), y = v => H - pad - v / max * (H - 2 * pad);
      const lines = platsAll.map(p => { const pts = weeks.map((w, k) => [x(k), y(val(w, p, metric))]); const d = pts.map((q, k) => (k ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
        return `<path class="area" fill="${plat(p).color}" d="${d} L${pts.at(-1)[0]} ${H - pad} L${pts[0][0]} ${H - pad} Z"/><path class="line" stroke="${plat(p).color}" d="${d}"/>${pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="2.6" fill="${plat(p).color}"/>`).join('')}`; }).join('');
      const now = total(weeks.at(-1), metric), prev = weeks.length > 1 ? total(weeks.at(-2), metric) : 0, ch = prev ? (now - prev) / prev * 100 : 0;
      return `<div class="panel chart"><h3>${label} <small>last ${weeks.length} weeks</small></h3><div><span class="big">${nf(now)}</span>${prev ? `<span class="delta ${ch >= 0 ? 'up' : 'down'}">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(0)}%</span>` : ''}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${[.25, .5, .75].map(t => `<line x1="0" x2="${W}" y1="${H * t}" y2="${H * t}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}${lines}</svg><div class="meta" style="display:flex;justify-content:space-between"><span>${esc(weeks[0])}</span><span>${esc(weeks.at(-1))}</span></div></div>`;
    };
    const last = weeks.at(-1);
    const rows = platsAll.map(p => ({ p, reach: val(last, p, 'reach'), eng: val(last, p, 'engagement'), saves: val(last, p, 'saves'), clicks: val(last, p, 'clicks'), leads: val(last, p, 'leads'), posts: val(last, p, 'posts') })).sort((a, b) => b.reach - a.reach);
    return head('Analytics', `${S.brand === 'all' ? 'All companies' : brand(S.brand).name} · week ending ${esc(last)} · written by the analyst agent.`)
      + `<div class="charts">${chart('reach', 'Reach')}${chart('engagement', 'Engagement')}${chart('leads', 'Leads')}</div>`

      + `<div class="panel" style="margin-top:18px"><h3>By channel <small>week ending ${esc(last)}</small></h3><table class="mtable"><tr><th>Channel</th><th>Posts</th><th>Reach</th><th>Engagement</th><th>Eng. rate</th><th>Saves</th><th>Clicks</th><th>Leads</th></tr>${rows.map(r => `<tr><td><span class="bname">${mono(plat(r.p).short, plat(r.p).color, 'sm')}${esc(plat(r.p).name)}</span></td><td>${r.posts}</td><td>${nf(r.reach)}</td><td>${nf(r.eng)}</td><td>${r.reach ? (r.eng / r.reach * 100).toFixed(1) + '%' : '—'}</td><td>${nf(r.saves)}</td><td>${nf(r.clicks)}</td><td><b>${r.leads}</b></td></tr>`).join('')}</table></div>`;
  },
  leads() {
    const list = items('lead'), opts = ['new', 'contacted', 'qualified', 'won', 'lost'];

  },
  trends() {
    const list = S.state.trends.filter(t => S.brand === 'all' || t.brand === S.brand);
    const latest = Object.values(list.reduce((a, t) => (a[t.brand] ||= t, a), {}));

      + (latest.length ? `<div class="stagger">${latest.map((t, x) => { const bb = brand(t.brand); return `<div class="panel" style="--i:${x}"><h3>${mono(bb.initials, bb.color, 'sm')}${esc(bb.name)} <small>${esc(t.date)}</small></h3><div class="md">${md(t.body.replace(/^---[\s\S]*?---/, ''))}</div></div>`; }).join('')}</div>` : empty('…', 'No trend reports yet. Run the weekly cycle.'));
  },
};

function interrupts(scope) {
  const now = Date.now(), old = i => i.created && (now - Date.parse(i.created)) > 48 * 3600e3;
  const list = [
    ['Hot leads waiting', scope.filter(i => i.type === 'lead' && i.status === 'new' && i.value === 'high').length, '#ff6b9a', 'leads'],
    ['Leads untouched 48h+', scope.filter(i => i.type === 'lead' && i.status === 'new' && old(i)).length, '#ffb547', 'leads'],
    ['Urgent tasks / complaints', scope.filter(i => i.type === 'task' && i.status === 'open' && i.priority === 'high').length, '#ff5d5d', 'tasks'],
    ['Publish failed', scope.filter(i => i.type === 'content' && i.publish_error).length, '#ff5d5d', 'pipeline'],
    ['Need an AI label', scope.filter(i => i.type === 'content' && i.ai_generated === true && i.ai_label !== 'required' && ['review', 'approved'].includes(i.status)).length, '#ffb547', 'review'],
    ['Sent back this week', scope.filter(i => i.type === 'content' && i.status === 'rejected').length, '#7d7b75', 'pipeline'],
  ];
  return `<div class="panel"><h3>What interrupts the loop <small>things agents hand to you</small></h3><div class="intr">${list.map(([l, v, c, go]) => `<div class="i ${v ? '' : 'zero'}" style="--c:${c}" data-view="${go}"><b>${v}</b><span>${l}</span></div>`).join('')}</div></div>`;
}

function engBodyWithDraft(item, draft) {

  if (k === -1) parts.push((parts.length ? '\n' : '') + block); else parts[k] = block;
  return parts.join('');
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-view],[data-brand],[data-plat],[data-act],[data-copy],[data-more],[data-jump],[data-editbtn],[data-save],[data-bulk],[data-week]');

  if (t.dataset.save) { const id = t.dataset.save, ta = document.querySelector(`[data-edit="${CSS.escape(id)}"]`); await act(id, { body: ta.value }, 'Edits saved', 'var(--accent)'); return; }

    const ids = items('content').filter(i => i.status === 'review').map(i => i.id);
    document.querySelectorAll('.card').forEach(c => c.classList.add('leaving'));
    let n = 0; for (const id of ids) { const r = await fetch('/api/items/' + encodeURIComponent(id), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: 'approved' }) }); if (r.ok) n++; }
    toast(`Approved ${n} of ${ids.length}`); S.anim = false; return refresh(true);
  }
  if (t.dataset.jump) { const [b, p] = t.dataset.jump.split('|'); S.brand = b; S.plat = p; S.view = 'pipeline'; location.hash = S.view; return render(); }
  if (t.dataset.view && !t.dataset.act) { S.view = t.dataset.view; location.hash = S.view; return render(); }
  if (t.dataset.brand) { S.brand = t.dataset.brand; return render(); }
  if (t.dataset.plat) { S.plat = t.dataset.plat; return render(); }
  if (t.dataset.copy) { const ta = document.querySelector(`[data-draft="${CSS.escape(t.dataset.copy)}"]`); navigator.clipboard.writeText(ta.value).then(() => toast('Copied to clipboard', 'var(--accent)')); return; }
  if (t.dataset.act) {
    const id = t.dataset.act, status = t.dataset.status;
    const noteEl = document.querySelector(`[data-note="${CSS.escape(id)}"]`), note = noteEl ? noteEl.value.trim() : '';
    if (t.hasAttribute('data-neednote') && !note) { noteEl.classList.remove('shake'); void noteEl.offsetWidth; noteEl.classList.add('shake'); noteEl.focus(); return toast('Add a note so the team knows why', 'var(--warn)'); }
    const payload = { status }; if (note) payload.note = note;
    const ta = document.querySelector(`[data-draft="${CSS.escape(id)}"]`);
    if (ta) payload.body = engBodyWithDraft(S.state.items.find(x => x.id === id), ta.value);
    const card = document.querySelector(`[data-card="${CSS.escape(id)}"]`);
    const good = ['approved', 'sent', 'done'].includes(status);
    if (card) { card.classList.add('leaving'); if (!good) card.classList.add('bad'); await new Promise(r => setTimeout(r, 320)); }
    const label = { approved: 'Approved · sent to publisher', rejected: 'Sent back to the team', sent: 'Marked as sent', skipped: 'Skipped', done: 'Done', open: 'Reopened' }[status] || status;
    const ok = await act(id, payload, label, good ? 'var(--ok)' : 'var(--warn)');
    if (!ok && card) card.classList.remove('leaving', 'bad');
  }
});
document.addEventListener('mouseover', e => { const v = e.target.closest('.phone video'); if (v) v.play().catch(() => {}); });
document.addEventListener('mouseout', e => { const v = e.target.closest('.phone video'); if (v) v.pause(); });
document.addEventListener('input', e => { const id = e.target.dataset.draft || e.target.dataset.note || e.target.dataset.edit; if (id) S.editing.add(id); });
document.addEventListener('change', e => { if (e.target.dataset.lead) act(e.target.dataset.lead, { status: e.target.value }, 'Lead → ' + e.target.value, 'var(--accent)'); });
document.addEventListener('keydown', e => { if (e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey) return; const k = +e.key; if (k >= 1 && k <= VIEWS.length) { S.view = VIEWS[k - 1][0]; location.hash = S.view; render(); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view) { S.view = v; if (S.state) render(); } });
window.addEventListener('resize', () => requestAnimationFrame(moveInd));
S.view = location.hash.slice(1) || 'overview';
refresh(true);
setInterval(refresh, 4000);
</script>
